<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Book Turquoise Steel, a Navajo family blues-rock band from Albuquerque, for festivals, casinos, venues, and community events. Press kit, bio, recent shows, and booking inquiry."
    />
    <meta name="theme-color" content="#0d0907" />
    <title>Book Turquoise Steel | Booking &amp; Press Kit</title>
    <link rel="canonical" href="https://turquoisesteel.live/booking/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turquoise Steel" />
    <meta property="og:url" content="https://turquoisesteel.live/booking/" />
    <meta property="og:title" content="Book Turquoise Steel | Booking &amp; Press Kit" />
    <meta
      property="og:description"
      content="Navajo family blues-rock from Albuquerque for festivals, casinos, venues, and community events. Press kit and booking inquiry."
    />
    <!-- [[NEEDS: share image]] add og:image / twitter:image once /images/share.jpg exists -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Book Turquoise Steel | Booking &amp; Press Kit" />
    <meta
      name="twitter:description"
      content="Navajo family blues-rock from Albuquerque for festivals, casinos, venues, and community events. Press kit and booking inquiry."
    />

    <link rel="dns-prefetch" href="https://rest.bandsintown.com" />
    <link rel="preconnect" href="https://rest.bandsintown.com" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!-- Static copy so Netlify Forms detects the React-rendered booking form. Keep fields in sync with src/BookingPage.jsx. -->
    <form name="booking" method="post" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking" />
      <input type="text" name="name" />
      <input type="text" name="organization" />
      <select name="event-type">
        <option>Festival</option>
        <option>Casino</option>
        <option>Venue/Bar</option>
        <option>Private Event</option>
        <option>Community/Cultural Event</option>
        <option>Other</option>
      </select>
      <input type="text" name="preferred-dates" />
      <input type="text" name="city-venue" />
      <input type="text" name="audience-size" />
      <select name="budget"><option>Prefer to discuss</option></select>
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/booking.jsx"></script>
  </body>
</html>
